<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a1c78">
<title>Quiz Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<!-- « ?v=… » : à augmenter à chaque mise à jour, pour que les téléphones rechargent tous les fichiers ensemble -->
<link rel="stylesheet" href="style.css?v=7">
</head>
<body class="player">
<main id="app"><p class="loading">Connexion…</p></main>

<script src="config.js?v=7"></script>
<script src="common.js?v=7"></script>
<script>
(async function () {
  "use strict";
  const { DB, esc, shape, ordinal, countUp, store, JOKER_PENALTY, JOKERS_X2, SABOTAGES, SABOTAGE_PENALTY, jokersUsed, sabotagesUsed } = QL;
  const fmtSecs = ms => (ms / 1000).toFixed(1).replace(".", ",") + " s";
  const avatar = QL.avatar || (() => "🙂");
  const app = document.getElementById("app");
  const KEY = "quizlive-player";
  // Identité du joueur : par onglet en mode démo (plusieurs onglets = plusieurs joueurs). En ligne, elle est aussi gardée
  // dans le navigateur : un étudiant qui ferme sa page ou son navigateur retrouve sa place en rouvrant le lien.
  const getId = () => store.get(KEY, "session") || (DB.mode === "firebase" ? store.get(KEY, "local") : null);
  const setId = v => { store.set(KEY, v, "session"); if (DB.mode === "firebase") store.set(KEY, v, "local"); };
  const delId = () => { store.del(KEY, "session"); store.del(KEY, "local"); };
  let reclaim = null;             // pseudo déjà pris que l'étudiant a confirmé être le sien
  const checked = {};             // question -> on a déjà cherché sur le serveur une réponse envoyée avant un rechargement
  let pollId = null, renderFails = 0;

  let code = null, pid = null, me = null, st = null;
  const answered = {};            // question -> réponse choisie
  const refused = {};             // question -> réponse refusée par le serveur
  let celebrated = -1;            // dernière question dont la correction a été animée
  let jokerArmed = -1;            // question sur laquelle le joker est activé (pas encore envoyé)
  let jokerSent = -1;             // question sur laquelle le joker est parti avec la réponse
  let sabArmed = null;            // { q, id, name } : cible choisie pour le sabotage de la question q (pas encore envoyé)
  let sabSent = null;             // { q, name } : sabotage parti avec la réponse
  let pickerOpen = false, roster = null; // liste des joueurs à viser (null = chargement)
  let introSeen = false;          // mon pseudo est déjà passé à l'écran de présentation
  let timerId = null;
  const unsubs = [];

  // ---------- Écran d'entrée ----------
  function joinScreen(msg, prefill) {
    unsubs.splice(0).forEach(u => u());
    clearInterval(timerId);
    document.body.className = "player";
    app.innerHTML = `
      <section class="join">
        <h1 class="logo">Quiz<span>Live</span></h1>
        ${DB.mode === "demo" ? '<p class="mode demo">● Mode démo (même ordinateur que le prof)</p>' : ""}
        <form id="f" autocomplete="off">
          <input id="code" inputmode="numeric" maxlength="7" placeholder="Code de la partie" value="${esc(prefill || "")}">
          <input id="name" maxlength="15" placeholder="Ton pseudo">
          <button class="btn big" id="go">C'est parti !</button>
          <p class="err" id="err">${esc(msg || "")}</p>
        </form>
      </section>`;
    document.getElementById(prefill ? "name" : "code").focus();
    document.getElementById("f").onsubmit = e => { e.preventDefault(); join(); };
  }

  async function join() {
    const err = t => { document.getElementById("err").textContent = t; document.getElementById("go").disabled = false; };
    const c = document.getElementById("code").value.replace(/\D/g, "");
    const name = document.getElementById("name").value.trim().replace(/\s+/g, " ");
    if (c.length !== 6) return err("Le code fait 6 chiffres : il est affiché à l'écran.");
    if (!name) return err("Choisis un pseudo.");
    document.getElementById("go").disabled = true;
    try {
      const s = await DB.get(`games/${c}/state`);
      if (!s) return err("Code introuvable. Vérifie le code affiché à l'écran.");
      if (s.phase === "end" || s.phase === "podium") return err("Cette partie est terminée.");
      const ps = (await DB.get(`games/${c}/players`)) || {};
      const saved = getId();
      let id = saved && saved.code === c && saved.pid ? saved.pid : Math.random().toString(36).slice(2, 10);
      const taken = Object.entries(ps).find(([k, p]) => k !== id && String(p.name || "").toLowerCase() === name.toLowerCase());
      if (taken) {
        // Salle d'attente : un pseudo en double est refusé. Partie lancée : c'est sans doute un étudiant qui revient
        // (navigateur fermé, autre téléphone) : il confirme en rappuyant, et retrouve son score.
        const started = s.phase !== "lobby" && s.phase !== "intro";
        const key = c + "|" + name.toLowerCase();
        if (!started) return err("Ce pseudo est déjà pris, choisis-en un autre.");
        if (reclaim !== key) {
          reclaim = key;
          return err("Ce pseudo est déjà dans la partie. Si c'est bien toi qui reviens, appuie encore sur « C'est parti ! » pour retrouver ta place. Sinon, choisis un autre pseudo.");
        }
        id = taken[0];
      }
      if (ps[id]) await DB.update(`games/${c}/players/${id}`, { name });
      else await DB.set(`games/${c}/players/${id}`, { name, score: 0, streak: 0 });
      code = c; pid = id;
      setId({ code, pid });
      enterGame();
    } catch (e) {
      err("Connexion impossible. Vérifie ton réseau (Wi-Fi ou 4G) et réessaie.");
    }
  }

  // ---------- Partie ----------
  function enterGame() {
    unsubs.splice(0).forEach(u => u());
    me = null; st = null; celebrated = jokerArmed = jokerSent = -1; introSeen = false;
    sabArmed = sabSent = null; pickerOpen = false; roster = null;
    for (const q in answered) delete answered[q];
    for (const q in refused) delete refused[q];
    for (const q in checked) delete checked[q];
    startPoll();
    unsubs.push(DB.on(`games/${code}/state`, v => { st = v; onState(); }));
    unsubs.push(DB.on(`games/${code}/players/${pid}`, v => {
      const had = me;
      me = v;
      if (had && !v) return leave("Tu as été retiré de la partie.");
      render();
    }));
    keepAwake();
  }

  function leave(msg) {
    delId();
    clearInterval(pollId);
    code = pid = me = st = null;
    joinScreen(msg, "");
  }

  function onState() {
    if (!st) return leave("Cette partie n'existe plus.");
    render(); // tout de suite : l'affichage n'attend jamais une réponse du serveur
    // Après un rechargement : a-t-on déjà répondu à la question en cours ? (vérifié en arrière-plan)
    if (st.phase === "question" && answered[st.q] === undefined && !checked[st.q]) {
      const q = st.q;
      checked[q] = true;
      DB.get(`games/${code}/answers/${q}/${pid}`).then(a => {
        if (!a || answered[q] !== undefined) return;
        if (Number.isInteger(a.a)) answered[q] = a.a;
        else if (typeof a.x === "string") answered[q] = a.x;
        else return;
        if (a.j) jokerSent = q;
        if (typeof a.s === "string") {
          sabSent = { q, name: null };
          DB.get(`games/${code}/players/${a.s}/name`).then(n => { if (sabSent && sabSent.q === q) { sabSent.name = n; if (st && st.q === q) render(); } }).catch(() => {});
        }
        if (st && st.q === q) render();
      }).catch(() => { checked[q] = false; });
    }
  }

  // Filet de sécurité : si la connexion « temps réel » reste bloquée (changement de réseau, veille…), on relit l'état par HTTPS
  // toutes les 3 secondes, et on ne le prend en compte que s'il est plus avancé que celui qu'on affiche.
  const PHASE_ORDER = { lobby: 0, intro: 1, "get-ready": 2, question: 3, reveal: 4, leaderboard: 5, podium: 6, end: 7 };
  const seq = s => !s ? -1000 : (s.phase === "podium" || s.phase === "end" ? 1000 : 0) + (s.q == null ? -1 : s.q) * 10 + (PHASE_ORDER[s.phase] || 0);
  function startPoll() {
    clearInterval(pollId);
    if (DB.mode !== "firebase") return;
    pollId = setInterval(async () => {
      if (!code || document.visibilityState !== "visible") return;
      try {
        const s = await DB.rest(`games/${code}/state`);
        if (s && seq(s) > seq(st)) { st = s; onState(); }
      } catch (e) { /* pas de réseau : le bandeau de connexion prévient déjà */ }
    }, 3000);
  }

  // ---------- Jokers : quitte ou double (JOKERS_X2 par partie) et sabotage (SABOTAGES par partie) ----------
  // Un joker envoyé avec la réponse n'est compté par le prof qu'à la correction : on le décompte ici en attendant
  const jokersLeft = () => !me ? 0 : Math.max(0, JOKERS_X2 - jokersUsed(me) - (jokerSent === st.q && me.lastQ !== st.q ? 1 : 0));
  const jokerLeft = () => jokersLeft() > 0;
  const sabLeft = () => !!me && SABOTAGES - sabotagesUsed(me) - (sabSent && sabSent.q === st.q && me.lastQ !== st.q ? 1 : 0) > 0;
  function jokerButton() {
    if (st.kind === "ouverte" || answered[st.q] !== undefined) return "";
    const buttons = [];
    if (jokerLeft()) {
      const on = jokerArmed === st.q;
      buttons.push(`<button class="joker${on ? " on" : ""}" id="joker">${on
        ? `🃏 Joker activé : x2 si juste, −${JOKER_PENALTY} si faux`
        : `🃏 Joker x2 (${jokersLeft()} restant${jokersLeft() > 1 ? "s" : ""})`}</button>`);
    }
    if (sabLeft()) {
      const on = sabArmed && sabArmed.q === st.q;
      buttons.push(`<button class="joker sab${on ? " on" : ""}" id="sabotage">${on
        ? `🎯 Cible : <b>${esc(sabArmed.name)}</b> · −${SABOTAGE_PENALTY} s'il a juste`
        : `🎯 Saboter un joueur`}</button>`);
    }
    return buttons.length ? `<div class="jokerbar">${buttons.join("")}</div>` : "";
  }

  // La liste des joueurs à viser : au classement, sauf pendant le final secret (alors par ordre alphabétique, sans scores)
  async function openPicker() {
    pickerOpen = true; roster = null; render();
    try {
      // Jamais d'attente sans fin : au bout de 5 s, on abandonne la liste (le joueur peut fermer la fenêtre et répondre normalement)
      const ps = (await Promise.race([DB.get(`games/${code}/players`), new Promise((_, no) => setTimeout(() => no(new Error("délai")), 5000))])) || {};
      roster = Object.entries(ps).filter(([id, p]) => id !== pid && p && p.name).map(([id, p]) => ({ id, name: String(p.name), score: p.score || 0 }));
      roster.sort(st && st.secret ? (a, b) => a.name.localeCompare(b.name, "fr") : (a, b) => b.score - a.score || a.name.localeCompare(b.name, "fr"));
    } catch (e) { roster = "erreur"; }
    if (pickerOpen) render();
  }
  function pickerHtml() {
    if (!pickerOpen) return "";
    const list = roster === null ? '<p class="pk-info">Chargement des joueurs…</p>'
      : roster === "erreur" ? '<p class="pk-info">Liste indisponible pour l\'instant. Ferme cette fenêtre et réponds sans sabotage, ou réessaie dans un instant.</p>'
      : !roster.length ? '<p class="pk-info">Personne d\'autre à viser pour l\'instant.</p>'
      : roster.map((p, k) => `<button class="pk${sabArmed && sabArmed.q === st.q && sabArmed.id === p.id ? " on" : ""}" data-id="${esc(p.id)}">
          ${st.secret ? "" : `<span class="pk-r">${k + 1}</span>`}<span class="pk-n">${esc(p.name)}</span>${st.secret ? "" : `<small>${p.score}</small>`}</button>`).join("");
    return `<div class="picker" id="picker"><div class="picker-box">
      <h3>🎯 Qui veux-tu saboter ?</h3>
      <p>Il perd <b>${SABOTAGE_PENALTY} points</b> s'il a la bonne réponse. Tout le monde verra que c'est toi. S'il se trompe, ton joker est perdu pour rien.</p>
      <div class="picker-list">${list}</div>
      <div class="picker-actions">
        ${sabArmed && sabArmed.q === st.q ? '<button class="btn" id="pk-clear">Retirer la cible</button>' : ""}
        <button class="btn ghost" id="pk-close">Fermer</button></div></div></div>`;
  }

  // ---------- Le rival : se comparer au joueur juste devant ----------
  function rivalTag() {
    if (st.secret || !me) return "";
    if (me.ahead) return `<p class="rival">🎯 Plus que <b>${me.ahead.g}</b> pts pour rattraper <b>${esc(me.ahead.n)}</b></p>`;
    if (me.behind) return me.behind.g > 0
      ? `<p class="rival lead">👑 En tête · ${esc(me.behind.n)} est à ${me.behind.g} pts</p>`
      : `<p class="rival">⚔️ À égalité avec ${esc(me.behind.n)}</p>`;
    return "";
  }
  function passTags() {
    if (st.secret) return "";
    const others = k => k > 1 ? ` et ${k - 1} autre${k > 2 ? "s" : ""}` : "";
    let out = "";
    if (me.passed) out += `<p class="pass up">🚀 Tu as doublé ${esc(me.passed.n)}${others(me.passed.k)} !</p>`;
    if (me.passedBy) out += `<p class="pass down">😱 ${esc(me.passedBy.n)}${others(me.passedBy.k)} ${me.passedBy.k > 1 ? "te dépassent" : "te dépasse"}</p>`;
    return out;
  }

  const remaining = () => st.duration * 1000 - (DB.now() - st.startedAt);

  // Si l'affichage plante, on réessaie deux fois, puis on propose de recharger plutôt que de laisser un écran figé
  function render() {
    try { renderInner(); renderFails = 0; }
    catch (e) {
      console.error("Affichage :", e);
      if (++renderFails <= 2) { setTimeout(render, 700); return; }
      app.innerHTML = `<div class="msg"><div class="big-emoji">⚠️</div><h2>Petit souci d'affichage</h2>
        <p>Appuie sur le bouton : tu retrouveras ta place et ton score.</p>
        <button class="btn big" onclick="location.reload()">↻ Recharger</button></div>`;
    }
  }

  function renderInner() {
    clearInterval(timerId);
    if (!st || !me) return;
    // Correction : les points défilent et le téléphone vibre, une seule fois par question
    const celebrate = st.phase === "reveal" && me.lastQ === st.q && st.kind !== "ouverte" && celebrated !== st.q;
    if (celebrate) celebrated = st.q;
    // Un joker envoyé qui n'a pas été retenu (réponse hors délai, sabotage rendu) redevient disponible
    if (st.phase === "reveal" && me.lastQ === st.q && jokerSent === st.q && !me.lastJoker) jokerSent = -1;
    if (st.phase === "reveal" && me.lastQ === st.q && sabSent && sabSent.q === st.q && !(me.lastSab && me.lastSab.r !== "blocked")) sabSent = null;
    if (st.phase !== "question" && st.phase !== "get-ready") pickerOpen = false;
    const typed = document.getElementById("txt") ? document.getElementById("txt").value : "";
    let body = "", mood = "";
    switch (st.phase) {
      case "lobby":
        body = `<div class="msg"><div class="big-emoji">✅</div><h2>Tu es dans la partie !</h2>
                <p>Ton pseudo s'affiche à l'écran. Le quiz va bientôt commencer…</p>
                <p class="joker-info">🃏 Tu as <b>${JOKERS_X2} jokers quitte ou double</b> pour toute la partie. Active-en un avant de répondre :
                  points x2 si tu as juste, −${JOKER_PENALTY} si tu te trompes.</p>
                <p class="joker-info">🎯 Tu as aussi <b>${SABOTAGES} joker sabotage</b> : vise un joueur, il perd ${SABOTAGE_PENALTY} points
                  s'il a la bonne réponse. Tout le monde verra que c'est toi !</p></div>`;
        break;
      case "intro": {
        // Présentation des joueurs : le téléphone s'allume quand son pseudo passe à l'écran
        const mine = st.who === pid;
        if (mine && !introSeen && navigator.vibrate) navigator.vibrate([80, 60, 80]);
        if (mine) introSeen = true;
        mood = mine ? "good" : "";
        body = mine
          ? `<div class="msg"><div class="big-emoji">${avatar(pid)}</div><h2>C'est toi !</h2><p>Ton pseudo est à l'écran 🎉</p></div>`
          : `<div class="msg"><div class="big-emoji">🎤</div><h2>${st.done ? "Tout le monde est là !" : "Les présentations"}</h2>
             <p>${st.done ? "Le quiz commence dans un instant…"
               : introSeen ? "Ton pseudo est passé à l'écran : regarde les autres arriver !"
               : "Ton pseudo va apparaître à l'écran… guette-le !"}</p>
             <p class="joker-info">Ton avatar : <b>${avatar(pid)}</b></p></div>`;
        break;
      }
      case "get-ready":
        body = `<div class="msg">${st.double ? '<p class="x2-banner">⚡ Double points ⚡</p>' : ""}
                <p class="qnum">Question ${st.q + 1} / ${st.total}</p><h2>Prépare-toi !</h2>
                <p>Lis la question à l'écran…</p><div class="loader"><div></div></div>${rivalTag()}${jokerButton()}</div>`;
        break;
      case "question":
        body = questionBody();
        break;
      case "reveal": {
        const r = revealBody(celebrate);
        body = r.html; mood = r.mood;
        break;
      }
      case "leaderboard":
        body = st.secret
          ? `<div class="msg"><div class="big-emoji">🤫</div><h2>Classement secret</h2>
             <p>${me.score || 0} points · tout se joue maintenant. Révélation au podium !</p></div>`
          : `<div class="msg"><div class="big-emoji">📊</div><h2>Tu es ${ordinal(me.rank || 1)}</h2>${moveTag()}${rivalTag()}
             <p>${me.score || 0} points · prochaine question dans un instant</p></div>`;
        break;
      case "podium":
        body = msg("🥁", "Le podium arrive…", "Regarde l'écran !");
        break;
      case "end": {
        const medal = ["🥇", "🥈", "🥉"][(me.rank || 99) - 1] || "🏁";
        const awards = Object.values(me.awards || {}).map(a => `<p class="award-tag">🏅 Trophée ${esc(a)}</p>`).join("");
        body = `<div class="msg"><div class="big-emoji">${medal}</div><h2>Classement final : ${ordinal(me.rank || 1)}</h2>
                <p>${me.score || 0} points. Merci d'avoir joué !</p>${recapHtml()}${awards}</div>`;
        break;
      }
    }
    document.body.className = "player " + mood + (celebrate ? " celebrate" : "");
    const score = me.score || 0;
    app.innerHTML = `
      <header class="me"><span class="who"><button class="rl" id="rl" title="Un souci ? Recharger la page (tu retrouves ta place)">↻</button>${esc(me.name)}</span>
        ${st.phase !== "end" && (jokerLeft() || sabLeft()) ? `<span class="jk" title="Jokers disponibles">${"🃏".repeat(jokersLeft())}${sabLeft() ? "🎯" : ""}</span>` : ""}
        <span class="score"><span data-count="${score}">${celebrate ? score - (me.lastPoints || 0) : score}</span> pts</span></header>
      ${body}${pickerHtml()}`;
    if (celebrate) {
      app.querySelectorAll("[data-count]").forEach(el => countUp(el, +el.textContent, +el.dataset.count, 1200));
      if (navigator.vibrate) navigator.vibrate(me.lastCorrect ? [60, 50, 60] : 300);
    }
    document.getElementById("rl").onclick = () => location.reload();
    const jb = document.getElementById("joker");
    if (jb) jb.onclick = () => {
      jokerArmed = jokerArmed === st.q ? -1 : st.q;
      if (navigator.vibrate) navigator.vibrate(jokerArmed === st.q ? [30, 40, 30] : 20);
      render();
    };
    const sb = document.getElementById("sabotage");
    if (sb) sb.onclick = () => { if (navigator.vibrate) navigator.vibrate(20); openPicker(); };
    const pk = document.getElementById("picker");
    if (pk) {
      pk.querySelectorAll(".pk").forEach(b => b.onclick = () => {
        const p = roster && roster.find(r => r.id === b.dataset.id);
        if (!p) return;
        sabArmed = { q: st.q, id: p.id, name: p.name };
        pickerOpen = false;
        if (navigator.vibrate) navigator.vibrate([30, 40, 30]);
        render();
      });
      const clear = document.getElementById("pk-clear");
      if (clear) clear.onclick = () => { sabArmed = null; pickerOpen = false; render(); };
      document.getElementById("pk-close").onclick = () => { pickerOpen = false; render(); };
      pk.onclick = e => { if (e.target === pk) { pickerOpen = false; render(); } };   // un toucher à côté de la fenêtre la ferme
    }

    if (st.phase === "question" && answered[st.q] === undefined && remaining() > 0) {
      app.querySelectorAll(".pad").forEach(b => b.onclick = () => answer(+b.dataset.a));
      const form = document.getElementById("write");
      if (form) {
        const input = document.getElementById("txt");
        input.value = typed; // un nouvel affichage (joker, classement) ne doit pas effacer ce qui est tapé
        form.onsubmit = e => { e.preventDefault(); const v = input.value.trim(); if (v) answer(v); };
        if (!pickerOpen) input.focus();
      }
      const dur = st.duration * 1000;
      timerId = setInterval(() => {
        const rem = remaining(), f = document.getElementById("tfill");
        if (f) f.style.width = Math.max(0, rem / dur * 100) + "%";
        document.body.classList.toggle("hurry", rem > 0 && rem <= 5000); // l'écran pulse en rouge à la fin
        if (rem <= 0) render();
      }, 150);
    }
  }

  const msg = (emoji, title, text) =>
    `<div class="msg"><div class="big-emoji">${emoji}</div><h2>${title}</h2><p>${text}</p></div>`;

  function questionBody() {
    const mine = answered[st.q];
    if (refused[st.q]) return msg("⚠️", "Réponse non enregistrée", "Le serveur l'a refusée. Préviens ton prof !");
    const jokerTag = (jokerSent === st.q ? '<p class="joker-tag">🃏 Joker joué : quitte ou double !</p>' : "")
      + (sabSent && sabSent.q === st.q ? `<p class="joker-tag">🎯 Sabotage lancé${sabSent.name ? ` sur <b>${esc(sabSent.name)}</b>` : ""} : réponse à la correction…</p>` : "");
    if (typeof mine === "string") {
      return `<div class="msg"><div class="big-emoji">✍️</div><h2>Réponse envoyée !</h2>
              <p class="goodans">« ${esc(mine)} »</p>${jokerTag}<p>Regarde l'écran…</p></div>`;
    }
    if (mine !== undefined) {
      return `<div class="msg"><div class="answer-chip c${mine}">${shape(mine)}</div>
              <h2>Réponse envoyée !</h2>${jokerTag}<p>Regarde l'écran…</p></div>`;
    }
    if (remaining() <= 0) return msg("⏰", "Temps écoulé", "Attends la correction…");
    const head = `<p class="q-text">${st.double ? '<span class="x2-tag">⚡ x2</span> ' : ""}${esc(st.text)}</p>
        <div class="tbar"><div id="tfill"></div></div>${jokerButton()}`;
    if (st.kind === "texte" || st.kind === "ouverte") {
      return `
        ${head}
        <form class="write" id="write" autocomplete="off">
          <input id="txt" maxlength="60" placeholder="${st.kind === "ouverte" ? "Ta réponse, en quelques mots" : "Ta réponse"}">
          <button class="btn big">Envoyer</button>
          ${st.kind === "ouverte" ? "<p class=\"note\">Question ouverte : pas de points. Les réponses s'affichent à l'écran, sans les pseudos.</p>" : ""}
        </form>`;
    }
    const opts = st.options || [];
    return `
      ${head}
      <div class="pads n${opts.length}">${opts.map((o, k) =>
        `<button class="pad c${k}" data-a="${k}">${shape(k)}<span>${esc(o)}</span></button>`).join("")}</div>`;
  }

  // Places gagnées ou perdues depuis la question précédente
  function moveTag() {
    const m = me.move, n = Math.abs(m || 0), s = n > 1 ? "s" : "";
    if (!n || st.phase === "end") return "";
    return `<p class="move">${m > 0 ? `▲ ${n} place${s} gagnée${s}` : `▼ ${n} place${s} perdue${s}`}</p>`;
  }

  function revealBody(celebrate) {
    if (me.lastQ !== st.q) return { html: msg("⏳", "Correction…", "Calcul des points"), mood: "" };
    if (st.kind === "ouverte") return { html: msg("💬", "Merci !", "Regarde les réponses de la classe à l'écran."), mood: "" };
    const rank = st.secret
      ? '<p class="rank">🤫 Classement secret jusqu’au podium</p>'
      : `<p class="rank">Tu es ${ordinal(me.rank || 1)} sur ${st.nPlayers || 1}</p>${moveTag()}${passTags()}`;
    const goodAnswer = st.kind === "texte" ? esc(st.accepted) : st.options ? esc(st.options[st.correct]) : "";
    const pts = me.lastPoints || 0;
    // Sabotages de cette question : celui que j'ai lancé, et celui que j'ai subi
    const sab = me.lastSab, hurt = me.lastHit;
    const sabTags = (sab ? (sab.r === "hit" ? `<p class="sab-tag good">🎯 Sabotage réussi : ${esc(sab.n)} perd ${sab.p} points !</p>`
        : sab.r === "miss" ? `<p class="sab-tag">💨 Sabotage raté : ${esc(sab.n)} s'est trompé… ton joker est perdu.</p>`
        : `<p class="sab-tag">🛡️ ${esc(sab.n)} avait déjà été visé avant toi : ton joker sabotage t'est rendu.</p>`) : "")
      + (hurt ? `<p class="sab-tag hurt">😱 ${esc(hurt.by)} t'a sabordé : −${hurt.p} points</p>` : "");
    if (me.lastCorrect) {
      return {
        mood: "good",
        html: `<div class="msg"><div class="big-emoji">${me.lastJoker ? "🃏" : "🎉"}</div><h2>Bonne réponse !</h2>
               <p class="pts">+<span data-count="${pts}">${celebrate ? 0 : pts}</span></p>
               ${me.lastJoker ? '<p class="joker-tag">Quitte ou double gagné : points x2 !</p>' : ""}
               ${st.double ? '<p class="x2-banner small">⚡ Question à double points</p>' : ""}
               ${me.streak >= 2 ? `<p class="streak-tag">🔥 Série de ${me.streak} bonnes réponses</p>` : ""}
               ${sabTags}${rank}</div>`
      };
    }
    const missed = me.lastAnswer === undefined || me.lastAnswer === null;
    return {
      mood: "bad",
      html: `<div class="msg"><div class="big-emoji">${missed ? "⏰" : "❌"}</div>
             <h2>${missed ? "Pas de réponse" : "Raté !"}</h2>
             ${me.lastJoker ? `<p class="pts">−<span data-count="${-pts}">${celebrate ? 0 : -pts}</span></p>
               <p class="joker-tag">🃏 Joker perdu…</p>` : ""}
             ${!missed && st.kind === "texte" ? `<p>Ta réponse : « ${esc(me.lastAnswer)} »</p>` : ""}
             <p class="goodans">La bonne réponse : <b>${goodAnswer}</b></p>${sabTags}${rank}</div>`
    };
  }

  // Le bilan de la partie, sur l'écran de fin
  function recapHtml() {
    const sc = st.scored || st.total || 0, ok = me.nOk || 0, li = [];
    li.push(`<li>✅ <b>${ok}</b> / ${sc} bonnes réponses${sc ? ` (${Math.round(100 * ok / sc)} %)` : ""}</li>`);
    if (ok) li.push(`<li>⚡ ${fmtSecs((me.tOk || 0) / ok)} en moyenne sur tes bonnes réponses</li>`);
    if ((me.best || 0) >= 2) li.push(`<li>🔥 Meilleure série : ${me.best} d'affilée</li>`);
    if (jokersUsed(me)) li.push(`<li>🃏 Jokers x2 : ${me.jWon || 0} gagné${(me.jWon || 0) > 1 ? "s" : ""}, ${me.jLost || 0} perdu${(me.jLost || 0) > 1 ? "s" : ""}</li>`);
    if (me.nS) li.push(`<li>🎯 Sabotage : ${me.sabHit ? "réussi" : "raté"}</li>`);
    if (me.sabTaken) li.push(`<li>😱 Sabordé ${me.sabTaken} fois</li>`);
    return `<ul class="recap">${li.join("")}</ul>`;
  }

  async function answer(k) {
    const q = st.q;
    if (answered[q] !== undefined) return;
    answered[q] = k;
    const joker = jokerArmed === q && jokerLeft() && st.kind !== "ouverte";
    const sab = sabArmed && sabArmed.q === q && sabLeft() && st.kind !== "ouverte" ? sabArmed : null;
    if (joker) jokerSent = q;
    if (sab) sabSent = { q, name: sab.name };
    pickerOpen = false;
    if (navigator.vibrate) navigator.vibrate(40);
    render();
    const payload = typeof k === "string" ? { x: k.slice(0, 60), t: DB.TS } : { a: k, t: DB.TS };
    if (joker) payload.j = 1;
    if (sab) payload.s = sab.id;                 // le joueur visé : le prof l'annonce à la correction
    const path = `games/${code}/answers/${q}/${pid}`;
    // Sans confirmation du serveur au bout de 2,5 s (connexion bloquée), la réponse repart aussi par HTTPS.
    // Si les deux arrivent, la seconde est simplement ignorée par les règles (une seule réponse par question).
    let acked = false;
    const backup = setTimeout(() => { if (!acked) DB.rest(path, "PUT", payload).catch(() => {}); }, 2500);
    try { await DB.set(path, payload); acked = true; clearTimeout(backup); }
    catch (e) {
      clearTimeout(backup);
      // Refusée : soit une réponse existe déjà (double appui, envoi de secours arrivé le premier), soit le serveur la refuse vraiment
      let ex = null;
      try { ex = await DB.get(path); } catch (e2) {}
      if (ex && (Number.isInteger(ex.a) || typeof ex.x === "string")) { acked = true; return; }
      refused[q] = true;
      if (joker) jokerSent = -1;
      if (sab) sabSent = null;
      if (st && st.q === q) render();
    }
  }

  // Empêche le téléphone de se mettre en veille pendant la partie
  async function keepAwake() {
    try { if ("wakeLock" in navigator) await navigator.wakeLock.request("screen"); } catch (e) {}
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && code) keepAwake(); });

  // ---------- Démarrage ----------
  try {
    await DB.ready();
  } catch (e) {
    app.innerHTML = `<div class="error-box">${esc(e.message)}<br><button class="btn" onclick="location.reload()">↻ Réessayer</button></div>`;
    return;
  }
  QL.watchConnection();
  const urlCode = (new URLSearchParams(location.search).get("code") || "").replace(/\D/g, "");
  const saved = getId();
  if (saved && saved.code && (!urlCode || urlCode === saved.code)) {
    const [p, s] = await Promise.all([DB.get(`games/${saved.code}/players/${saved.pid}`), DB.get(`games/${saved.code}/state`)]);
    if (p && s) { code = saved.code; pid = saved.pid; return enterGame(); }
  }
  joinScreen("", urlCode);
})();
</script>
</body>
</html>
